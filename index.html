<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <nav>
        <div class="left">Future Work Space</div>
        <div class="right"><button>Add New Task</button></div>
      </nav>

      <section class="board">
        <div id="Todo" class="task-column">
          <div class="heading">
            <div class="left">TO DO</div>
            <div class="right">COUNT</div>
          </div>
          <div class="task" draggable="true">
            <h2>Task 1</h2>
            <p>Task k baare me kuch likho</p>
            <button>Delete</button>
          </div>
        </div>
        <div id="Progress" class="task-column">
          <div class="heading">
            <div class="left">IN PROGRESS</div>
            <div class="right">COUNT</div>
          </div>
        </div>
        <div id="Done" class="task-column">
          <div class="heading">
            <div class="left">DONE</div>
            <div class="right">COUNT</div>
          </div>
        </div>
      </section>
    </main>
  </body>
  <script src="script.js"></script>
</html>
