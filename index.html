<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To DO</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <div class="nav">
        <div class="left">Kanban</div>
        <div class="right"><button>Add New Task</button></div>
      </div>

      <section class="bord">
        <div id="todo" class="task-column">
          <div class="heading">
            <div class="left">To Do</div>
            <div class="righ">Count</div>
          </div>
          <div draggable="true" class="task">
            <h2>Task 1</h2>
            <p>Description for task 1</p>
            <button>Delete</button>
          </div>
        </div>
        <div id="progress" class="task-column">
          <div class="heading">
            <div class="left">In Progress</div>
            <div class="right">Count</div>
          </div>
        </div>
        <div id="done" class="task-column">
          <div class="heading">
            <div class="left">Done</div>
            <div class="left">Count</div>
          </div>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
